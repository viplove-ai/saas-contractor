name: CI

on:
  pull_request:
  push:
    branches: [main, release]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Testcontainers needs a Docker daemon; ubuntu-latest runners ship one.
      - name: Build and test
        working-directory: nirman/backend
        run: ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: nirman/backend/target/surefire-reports/

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nirman/frontend/package-lock.json

      - name: Install
        working-directory: nirman/frontend
        run: npm ci

      - name: Lint
        working-directory: nirman/frontend
        run: npm run lint

      - name: Typecheck
        working-directory: nirman/frontend
        run: npm run typecheck

      - name: Unit tests
        working-directory: nirman/frontend
        run: npm run test

      - name: Build
        working-directory: nirman/frontend
        run: npm run build

  e2e:
    name: End to end (Playwright)
    runs-on: ubuntu-latest
    # Separate from the frontend job rather than another step on it: this one installs a
    # browser and builds the app, which is several minutes the lint-and-typecheck feedback
    # loop should not wait behind.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nirman/frontend/package-lock.json

      - name: Install
        working-directory: nirman/frontend
        run: npm ci

      # The runner is where these actually run. Playwright ships no browser build for
      # macOS 12, which is the primary dev machine (the same constraint that gives
      # AbstractIntegrationTest its no-Docker path), so the offline sync journeys are
      # verified here and nowhere else.
      - name: Install Playwright browsers
        working-directory: nirman/frontend
        run: npx playwright install --with-deps chromium

      # playwright.config.ts builds the app and serves it; e2e runs against a production
      # build because the service worker and manifest only exist after `vite build`.
      - name: Run end-to-end tests
        working-directory: nirman/frontend
        run: npm run e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: nirman/frontend/playwright-report/
