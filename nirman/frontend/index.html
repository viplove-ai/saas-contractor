<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#C2410C" />
    <!--
      The -v<n> in every icon filename is load-bearing, not decoration. Redrawing the art
      behind a stable URL changes nothing a browser can see: Chrome compares the manifest
      it fetched at install time against the one it fetches now, icon URLs and not icon
      bytes, so an unchanged manifest means an unchanged home-screen icon for the life of
      the install. Bump the token on every icon change and rename the files with it.
    -->
    <link rel="icon" href="/brand/favicon-v2.svg" type="image/svg+xml" />
    <link rel="icon" href="/brand/favicon-32-v2.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/brand/favicon-16-v2.png" sizes="16x16" type="image/png" />
    <!--
      iOS ignores the manifest icons when adding to the home screen — and captures this one
      at that moment and never again. A phone that already carries the shortcut keeps the
      icon it was added with until somebody removes it and adds it back.
    -->
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon-v2.png" />
    <!--
      public/brand/manifest.webmanifest is the source of truth for the install metadata, so
      vite-plugin-pwa is configured with `manifest: false` and must not inject a second one.
    -->
    <link rel="manifest" href="/brand/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nirman" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Kalam:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>Nirman — Today</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
