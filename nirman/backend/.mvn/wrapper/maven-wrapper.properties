# Apache Maven Wrapper 3.3.2, script-only distribution: there is no maven-wrapper.jar to
# vendor or keep in step with a JDK. The wrapper downloads Maven on first use and caches it
# under ~/.m2/wrapper, so a fresh clone needs a JDK and nothing else.
#
# The Maven line here matches the backend Dockerfile's maven:3.9-eclipse-temurin-21 image,
# so a local build and a container build run the same Maven.
#
# distributionSha256Sum is verified by mvnw before the download is unpacked. Change the
# version and the checksum together, never one alone.
wrapperVersion=3.3.2
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
distributionSha256Sum=4ec3f26fb1a692473aea0235c300bd20f0f9fe741947c82c1234cefd76ac3a3c
