spring:
  application:
    name: nirman-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nirman}
    username: ${DB_USER:nirman}
    password: ${DB_PASSWORD:nirman_dev_password}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    open-in-view: false          # entities must not be lazily loaded in the view layer
    hibernate:
      ddl-auto: validate         # Flyway owns the schema, Hibernate only checks it
    properties:
      hibernate:
        jdbc.time_zone: UTC
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 60MB

server:
  port: 8080
  error:
    include-message: never       # error bodies come from GlobalExceptionHandler only
    include-stacktrace: never
  compression:
    enabled: true
  forward-headers-strategy: framework

app:
  timezone: Asia/Kolkata
  jwt:
    secret: ${JWT_SECRET}
    access-token-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_DAYS:30}
    issuer: nirman
  security:
    max-failed-logins: 5
    lockout-minutes: 15
    bcrypt-strength: 12
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:nirman_minio}
    secret-key: ${STORAGE_SECRET_KEY:nirman_minio_dev_password}
    bucket: ${STORAGE_BUCKET:nirman-files}
    signed-url-minutes: 10
    max-file-size-bytes: 15728640
    allowed-content-types: image/jpeg,image/png,image/webp,application/pdf
  business:
    default-standard-shift-hours: 8
    bill-required-above: 5000
    admin-approval-above: 25000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{correlationId}] %logger{36} - %msg%n"
  level:
    in.nirman: INFO
    org.hibernate.SQL: WARN
