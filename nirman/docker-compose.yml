# Local development stack. `docker compose up -d` gives Postgres, MinIO, backend and frontend.
# Production uses the same file with `--profile prod` so Nginx serves the built SPA.

services:
  postgres:
    image: postgres:16-alpine
    container_name: nirman-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-nirman}
      POSTGRES_USER: ${DB_USER:-nirman}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nirman_dev_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nirman} -d ${DB_NAME:-nirman}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: nirman-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nirman_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nirman_minio_dev_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Creates the bucket once, then exits. Keeps bucket setup out of application startup.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-nirman_minio} ${MINIO_ROOT_PASSWORD:-nirman_minio_dev_password} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-nirman-files} &&
      mc anonymous set none local/${MINIO_BUCKET:-nirman-files} &&
      echo 'bucket ready'"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nirman-backend
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-dev}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-nirman}
      DB_USER: ${DB_USER:-nirman}
      DB_PASSWORD: ${DB_PASSWORD:-nirman_dev_password}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-15}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-30}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-nirman_minio}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-nirman_minio_dev_password}
      STORAGE_BUCKET: ${MINIO_BUCKET:-nirman-files}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: nirman-frontend
    profiles: ["dev"]
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public

  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
    container_name: nirman-nginx
    profiles: ["prod"]
    depends_on:
      - backend
    environment:
      # The image renders frontend/nginx.default.conf.template at startup.
      API_UPSTREAM: backend:8080
      DNS_RESOLVER: 127.0.0.11
    ports:
      - "80:80"

volumes:
  postgres_data:
  minio_data:
